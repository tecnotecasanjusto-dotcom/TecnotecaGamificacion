<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tecnoteca - Encuesta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../index.css">
  <script src="page-theme.js" defer></script>
</head>
<body class="survey-page">
  <div class="floating-logos" aria-hidden="true">
    <img class="floating-logo logo-shape logo-f1" src="../images/tec.png" alt="">
    <img class="floating-logo logo-textmark logo-f2" src="../images/educ.png" alt="">
    <img class="floating-logo logo-shape logo-f3" src="../images/tec.png" alt="">
    <img class="floating-logo logo-textmark logo-f4" src="../images/educ.png" alt="">
    <img class="floating-logo logo-shape logo-f5" src="../images/tec.png" alt="">
    <img class="floating-logo logo-textmark logo-f6" src="../images/educ.png" alt="">
  </div>

  <div class="floating-squares" aria-hidden="true">
    <div class="square-logo sq-1"><img src="../images/tec.png" alt=""></div>
    <div class="square-logo sq-2"><img src="../images/educ.png" alt=""></div>
  </div>

  <main class="app-shell subpage-shell demo-shell">
    <section class="panel demo-panel survey-demo">
      <div class="demo-top">
        <a class="btn btn-soft back-home-btn" href="../index.html">Volver al inicio</a>
        <span class="demo-user">Jugador: <strong id="playerLabel">Sin nombre</strong></span>
      </div>

      <h1 class="hero-title demo-title">Ayudanos a mejorar</h1>

      <form id="demoSurveyForm" class="demo-form">

        <label>
          ¿Como fue tu visita?
          <select name="visita" required>
            <option value="" selected disabled>Selecciona una opcion</option>
            <option value="Excelente">Excelente</option>
            <option value="Buena">Buena</option>
            <option value="Regular">Regular</option>
            <option value="Mejorable">Mejorable</option>
          </select>
        </label>

        <label>
          ¿Que te gusto mas?
          <select name="gusto" required>
            <option value="" selected disabled>Selecciona una opcion</option>
            <option value="Zona de Gamificacion">Zona de Gamificacion</option>
            <option value="Zona de Robotica">Zona de Robotica</option>
            <option value="Zona de Impresion 3D">Zona de Impresion 3D</option>
            <option value="Zona Recorrido Historico">Zona Recorrido Historico</option>
            <option value="Zona de Cine">Zona de Cine</option>
          </select>
        </label>

        <label>
          Comentarios
          <textarea name="comentarios" rows="4" placeholder="Escribe una sugerencia..."></textarea>
        </label>

        <div class="demo-actions">
          <button class="btn btn-primary" type="submit">ENVIAR</button>
        </div>

      </form>

      <p id="surveyFeedback" class="demo-feedback">
        Completa el formulario para ver el mensaje de envio.
      </p>

    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBdOaDropLLWstu3FUPaBxZCWO9asW97Co",
      authDomain: "tecnotecagamificacion.firebaseapp.com",
      databaseURL: "https://tecnotecagamificacion-default-rtdb.firebaseio.com",
      projectId: "tecnotecagamificacion",
      storageBucket: "tecnotecagamificacion.firebasestorage.app",
      messagingSenderId: "688097031917",
      appId: "1:688097031917:web:5ded9a43f2324b0eed7ee4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    console.log("🔥 Firebase conectado a tecnotecagamificacion");

    // Jugador
    const player = localStorage.getItem("tecnotecaPlayerName") || "Sin nombre";
    document.getElementById("playerLabel").textContent = player;

    const form = document.getElementById("demoSurveyForm");
    const feedback = document.getElementById("surveyFeedback");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      feedback.textContent = "Enviando respuestas...";

      try {
        const selectGusto = form.gusto;
        const gustoTexto = selectGusto.options[selectGusto.selectedIndex].text;

        const encuestaData = {
          jugador: player,
          visita: form.visita.value,
          gusto: gustoTexto,
          comentarios: form.comentarios.value,
          fecha: new Date().toISOString(),
          timestamp: Date.now()
        };

        console.log("📤 Enviando:", encuestaData);

        await push(ref(db, "encuestas"), encuestaData);

        console.log("✅ Guardado correctamente");

        feedback.textContent = "✅ ¡Gracias por tu respuesta!";
        form.reset();

        setTimeout(() => {
          window.location.href = "../index.html";
        }, 1500);

      } catch (error) {
        console.error("❌ ERROR:", error);
        feedback.textContent = "❌ Error al enviar";
      }
    });
  </script>

</body>
</html>
